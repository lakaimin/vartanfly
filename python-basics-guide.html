<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Basics Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;700&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F7F9FC;
            --card-bg: #FFFFFF;
            --text-main: #2D3748;
            --text-muted: #718096;
            --accent-color: #FF6B6B;
            --accent-hover: #FF5252;
            --code-bg: #1A202C;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --radius: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 預設字體，會根據語言切換時動態調整 */
            font-family: 'Noto Sans TC', 'Inter', 'Be Vietnam Pro', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: 5vw;
            position: relative;
        }

        /* 語言切換按鈕設計 */
        .lang-switch {
            display: flex;
            justify-content: center;
            background: white;
            padding: 5px;
            border-radius: 50px;
            box-shadow: var(--shadow);
            width: fit-content;
            margin: 0 auto 30px auto;
        }

        .lang-switch button {
            background: transparent;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-muted);
            transition: var(--transition);
            font-family: inherit;
        }

        .lang-switch button.active {
            background: var(--accent-color);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-main);
            letter-spacing: -0.5px;
            transition: var(--transition);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
            transition: var(--transition);
        }

        .search-container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 24px;
            font-size: 1.1rem;
            border: 2px solid transparent;
            border-radius: 50px;
            background-color: var(--card-bg);
            box-shadow: var(--shadow);
            outline: none;
            transition: var(--transition);
            font-family: inherit;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.15);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon {
            font-size: 2rem;
            background: rgba(255, 107, 107, 0.1);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            transition: var(--transition);
        }

        .card:hover .icon {
            background: var(--accent-color);
            color: white;
            transform: scale(1.05);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .card-body {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: var(--transition);
        }

        .card.active .card-body {
            max-height: 400px;
            opacity: 1;
            margin-top: 20px;
        }

        .description {
            color: var(--text-muted);
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        pre {
            background: var(--code-bg);
            color: #E2E8F0;
            padding: 15px;
            border-radius: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
            line-height: 1.5;
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-muted);
            font-size: 1.2rem;
            padding: 40px;
            display: none;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .grid { grid-template-columns: 1fr; }
            body { padding: 5vw 24px; }
            .lang-switch { margin-top: 10px; }
        }
        
        /* 桌面版語言切換器可置於右上方 */
        @media (min-width: 1024px) {
            .lang-switch {
                position: absolute;
                top: 5vw;
                right: 5vw;
                margin: 0;
            }
        }
    </style>
</head>

                code: { 
                    zh: 'from bs4 import BeautifulSoup\nsoup = BeautifulSoup(web.text, "html.parser")', 
                    en: 'from bs4 import BeautifulSoup\nsoup = BeautifulSoup(web.text, "html.parser")', 
                    vi: 'from bs4 import BeautifulSoup\nsoup = BeautifulSoup(web.text, "html.parser")' 
                }
            },
            { 
                icon: "⏱️️",
                title: { zh: "版本控制", en: "Version Control", vi: "Kiểm soát phiên bản" },
                desc: { 
                    zh: "程式碼的專屬時光機。記錄每次修改，隨時能還原到過去狀態。", 
                    en: "A time machine for code. Records every change so you can revert to past states.", 
                    vi: "Cỗ máy thời gian của mã nguồn. Ghi lại mọi sửa đổi để có thể khôi phục bất cứ lúc nào." 
                },
                code: { 
                    zh: 'git add .\ngit commit -m "新增功能"', 
                    en: 'git add .\ngit commit -m "Add feature"', 
                    vi: 'git add .\ngit commit -m "Thêm tính năng"' 
                }
            },
            { 
                icon: "☁️",
                title: { zh: "雲端部署", en: "Cloud Deployment", vi: "Triển khai Đám mây" },
                desc: { 
                    zh: "把寫好的程式安裝到永遠不關機的伺服器，讓全世界都能使用。", 
                    en: "Install your program on servers that never turn off so the whole world can use it.", 
                    vi: "Cài đặt chương trình lên máy chủ luôn hoạt động để cả thế giới có thể sử dụng." 
                },
                code: { 
                    zh: 'git push heroku main', 
                    en: 'git push heroku main', 
                    vi: 'git push heroku main' 
                }
            },
            { 
                icon: "🔒",
                title: { zh: "資訊安全", en: "Info Security", vi: "Bảo mật thông tin" },
                desc: { 
                    zh: "保護程式不被破壞。使用環境變數來安全地隱藏重要密碼。", 
                    en: "Protect programs from being hacked. Use environment variables to hide passwords safely.", 
                    vi: "Bảo vệ chương trình khỏi sự phá hoại. Dùng biến môi trường để ẩn mật khẩu an toàn." 
                },
                code: { 
                    zh: 'import os\npassword = os.getenv("MY_SECRET")', 
                    en: 'import os\npassword = os.getenv("MY_SECRET")', 
                    vi: 'import os\npassword = os.getenv("MY_SECRET")' 
                }
            }
        ];

        let currentLang = 'zh'; // 預設語言
        const container = document.getElementById('cardContainer');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');

        // 切換語言功能
        function setLang(lang) {
            currentLang = lang;
            
            // 更新按鈕狀態
            document.querySelectorAll('.lang-switch button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');

            // 更新靜態 UI 文字
            document.getElementById('ui-title').innerText = uiText[lang].title;
            document.getElementById('ui-subtitle').innerText = uiText[lang].subtitle;
            searchInput.placeholder = uiText[lang].placeholder;
            noResults.innerText = uiText[lang].noResults;
            document.body.style.fontFamily = uiText[lang].fontFamily;

            // 重新渲染卡片
            renderCards(searchInput.value.trim());
        }

        // 渲染卡片
        function renderCards(filterText = '') {
            // 清空目前畫面，但保留 no-results 節點
            container.innerHTML = '';
            let count = 0;
            const filterLower = filterText.toLowerCase();

            data.forEach(item => {
                const titleText = item.title[currentLang];
                const descText = item.desc[currentLang];

                // 搜尋過濾 (比對當前語言的標題與說明)
                if (titleText.toLowerCase().includes(filterLower) || descText.toLowerCase().includes(filterLower)) {
                    count++;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="icon">${item.icon}</div>
                            <div class="card-title">${titleText}</div>
                        </div>
                        <div class="card-body">
                            <p class="description">${descText}</p>
                            <pre><code>${item.code[currentLang]}</code></pre>
                        </div>
                    `;
                    
                    // 點擊展開/收合
                    card.addEventListener('click', () => {
                        const isActive = card.classList.contains('active');
                        // 若要單獨展開可取消下方註解：
                        // document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
                        if (!isActive) card.classList.add('active');
                        else card.classList.remove('active');
                    });

                    container.appendChild(card);
                }
            });

            // 處理查無結果的顯示
            if (count === 0) {
                container.appendChild(noResults);
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
                container.appendChild(noResults); 
            }
        }

        // 監聽搜尋輸入
        searchInput.addEventListener('input', (e) => {
            renderCards(e.target.value.trim());
        });

        // 啟動初始渲染
        setLang(currentLang);
    </script>
</body>
</html>
