<body>
<div class="shell"><header class="header"><button class="brand" data-go="home" aria-label="回到首頁"><span class="brand-icon" aria-hidden="true">🌱</span><span><span class="brand-title">植物科學探險</span><span class="brand-sub">LITTLE BOTANIST CLUB</span></span></button><nav id="nav" class="topnav" aria-label="主選單"></nav><div class="header-right"><span class="pill" id="xp-pill">⭐ 0 XP</span><button class="round-btn" id="sound-btn" title="切換音效" aria-label="切換音效">🔊</button></div></header><main id="app"></main><footer class="footer"><span>🌿 植物科學探險｜114學年度上學期・國小三年級自然科學（依上傳之第1～4回學習卷主題改編）</span><span>單一檔案・離線可用・進度只儲存在本機瀏覽器。建議使用 Chrome、Edge 或 Safari。</span></footer></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// 題目為依四回學習卷的知識點重新編寫之互動練習，非逐題照錄；無外部資源或追蹤。
const chapters=[
 {id:1,icon:'🔎',name:'觀察植物與植物的莖',short:'觀察小高手',source:'第1回・1-1、1-2',desc:'五感觀察、植物部位、草本莖與木本莖'},
 {id:2,icon:'🍃',name:'植物的葉與根',short:'葉根偵探社',source:'第2回・1-3',desc:'葉脈、葉緣、葉序、軸根與鬚根'},
 {id:3,icon:'🌼',name:'繁衍與資源永續',short:'花果研究所',source:'第3回・1-4',desc:'花的構造、種子傳播、植物的生活用途'},
 {id:4,icon:'🌎',name:'第一單元總複習',short:'地球守護隊',source:'第4回・單元複習',desc:'植物大統整、紙張回收與珍惜資源'}
];
const lessons=[
 {id:'1-1',ch:1,title:'變身植物觀察家',tag:'觀察方法',lead:'用眼睛、鼻子和雙手仔細觀察植物，發現平常沒注意的小祕密。',visual:'senses',points:[['眼睛看一看','比較葉片的形狀、顏色、葉緣和葉脈。'],['鼻子聞一聞','留意植物自然散發的氣味，不要靠太近吸入花粉。'],['雙手輕輕摸','在安全、允許的情況下，感受葉面的質地，觀察後記得洗手。'],['安全最重要','不認識的植物不可任意採摘、品嘗或觸碰。']],check:['看到不認識的植物，怎麼做最安全？',['摘一片葉子吃吃看','用眼睛觀察特徵','立刻折下花朵','揉碎植物靠近鼻子聞'],1,'不認識的植物以眼睛觀察為主，不應隨意品嘗或採摘。']},
 {id:'1-2',ch:1,title:'植物的身體地圖',tag:'六大部位',lead:'一株植物有不同的部位，每個部位就像探險隊裡的專家。',visual:'anatomy',points:[['根','多在土壤中，吸收水分與養分，也能固定植物。'],['莖','支撐植物的身體，運送水分和養分。'],['葉','常能接收陽光，幫助植物製造養分。'],['花、果實、種子','與植物繁殖有關；不同植物不一定同時具有所有可見部位。']],check:['把植物固定在土裡的主要部位是？',['花瓣','果實','根','葉'],2,'根能固定植株，也能從土壤吸收水分。']},
 {id:'1-3',ch:1,title:'莖有三種個性',tag:'植物的莖',lead:'有的莖柔軟、有的堅硬，還有的喜歡攀爬。',visual:'stems',points:[['草本莖','通常較柔軟，例如昭和草。'],['木本莖','通常較堅硬，有木質部，例如木棉、白千層。'],['藤本莖','常會攀爬或匍匐，需要依附或延伸，例如常春藤。'],['莖的功用','支撐植物，讓葉子接觸陽光，也能運送水與養分。']],check:['木棉樹粗硬的莖屬於哪一類？',['草本莖','木本莖','藤本莖','沒有莖'],1,'木棉的莖較堅硬，屬於木本莖。']},
 {id:'1-4',ch:1,title:'植物向光大冒險',tag:'生長與陽光',lead:'植物努力伸展莖葉，是為了獲得生長需要的光線。',visual:'sun',points:[['莖向上伸展','幫助葉子到達能接收陽光的位置。'],['葉子接收陽光','葉能利用光來製造植物所需的養分。'],['觀察環境','光照、水分和生長空間都會影響植物的樣子。']],check:['植物莖葉向陽光伸展，主要有助於？',['吸收更多陽光','讓根浮出地面','把花變成石頭','不再需要水'],0,'植物需要光進行光合作用。']},
 {id:'1-5',ch:1,title:'植物特徵觀察筆記',tag:'觀察練習',lead:'試著像科學家一樣，描述而不是猜測。',visual:'journal',points:[['先看全貌','留意植物的大小、長相與生長場所。'],['再看局部','仔細比對莖、葉的形狀和排列方式。'],['記錄差異','使用「柔軟、堅硬、光滑、有鋸齒」等具體詞語。'],['保護植物','用拍照或畫圖留下紀錄，不必傷害植物。']],check:['下列何者最適合當觀察紀錄？',['這株植物很厲害','葉子邊緣有鋸齒','我覺得它很幸運','這株植物很神奇'],1,'可以直接看見或測量的特徵，更適合當科學觀察紀錄。']},
 {id:'2-1',ch:2,title:'葉子邊緣大不同',tag:'葉緣',lead:'別小看葉子的外框！有些像平滑的線，有些像小鋸子。',visual:'margin',points:[['平滑狀','葉片邊緣較完整、沒有明顯齒狀突起。'],['鋸齒狀','葉緣有一個個像鋸齒的小凸起。'],['觀察小技巧','比較葉片外緣，不要把葉脈和葉緣混在一起。']],check:['葉子邊緣有一個個小尖齒，叫做？',['平滑狀','鋸齒狀','平行脈','輪生'],1,'鋸齒狀是葉緣的形態，不是葉脈。']},
 {id:'2-2',ch:2,title:'葉脈公路網',tag:'葉脈',lead:'葉子裡的線條像交通網，有平行的，也有分岔相連的。',visual:'veins',points:[['平行脈','多條葉脈大致平行延伸，例如稻子。'],['網狀脈','葉脈分支、交錯成網，例如番石榴。'],['分辨方式','觀察葉片內部線條的走向，而不是邊緣。']],check:['葉脈分支交錯、像一張網，是哪一種？',['平行脈','網狀脈','鋸齒葉緣','軸根'],1,'網狀脈的葉脈會交織成網。']},
 {id:'2-3',ch:2,title:'葉子排隊有規矩',tag:'葉序',lead:'葉子長在莖節上的位置，也能成為辨認植物的線索。',visual:'arrangement',points:[['互生','每個節上通常長出一片葉子，沿莖交錯排列。'],['對生','一個節上有相對的兩片葉子。'],['輪生','一個節上長出三片或以上葉子。'],['觀察重點','先看「同一個節」有幾片葉，不是只看一整株的總數。']],check:['在同一個莖節長出兩片相對的葉子，稱為？',['互生','對生','輪生','平行脈'],1,'兩片葉子在莖節上相對生長，稱為對生。']},
 {id:'2-4',ch:2,title:'地底下的根根隊',tag:'軸根與鬚根',lead:'不同植物的根系長得不一樣，但都為植物的生存努力工作。',visual:'roots',points:[['軸根','有較明顯、粗大的主根，旁邊長出側根。'],['鬚根','有許多粗細相近的根，看不出明顯主根。'],['根的工作','吸收水分和養分，並協助固定植物。'],['常見例子','例如蔥常見鬚根型態；有明顯主根的植物呈軸根型態。']],check:['許多細根長在一起、看不出明顯主根，叫做？',['軸根','鬚根','葉脈','莖節'],1,'鬚根有許多粗細接近的根。']},
 {id:'2-5',ch:2,title:'葉與根的雙人合作',tag:'構造與功能',lead:'根供應水分、葉接收光線，植物的部位是合作的好夥伴。',visual:'team',points:[['根的角色','吸收土壤中的水分和礦物養分。'],['莖的角色','協助將水與養分運送到植物各部位。'],['葉的角色','接收光線製造養分。'],['綜合觀察','植物的部位有不同分工，生長時彼此合作。']],check:['吸收土壤水分與養分的主要部位是？',['葉','根','花瓣','果實'],1,'根的主要功能之一是吸收水分和礦物養分。']},
 {id:'3-1',ch:3,title:'花朵小小實驗室',tag:'花的構造',lead:'花除了漂亮，也有不同構造，幫助植物完成繁殖。',visual:'flower',points:[['花瓣','常有顏色或氣味，能吸引傳粉動物。'],['花萼','常在花朵外側，能保護花苞。'],['雄蕊','包含花藥等部分，花粉通常由花藥產生。'],['雌蕊','與種子形成等繁殖過程有關。']],check:['花朵還沒開時，常能保護花苞的構造是？',['花萼','葉脈','側根','果皮'],0,'花萼通常位於花朵外側，有保護花苞的功能。']},
 {id:'3-2',ch:3,title:'種子的旅行祕密',tag:'繁衍與傳播',lead:'植物不能到處走動，卻有許多方法讓下一代前往新地方。',visual:'seeds',points:[['動物幫忙','動物吃下果實後，部分種子可能被帶往別處。'],['風的幫忙','有些種子很輕，能靠風飄散。'],['果實的角色','果實通常包覆或保護種子。'],['安全提醒','野外不認識的果實，不可以隨便採來吃。']],check:['動物吃果實，可能幫助植物做到什麼？',['讓種子傳播','使葉脈消失','把根變成花','讓植物不再生長'],0,'有些植物利用動物協助種子傳播。']},
 {id:'3-3',ch:3,title:'水果的奇妙任務',tag:'果實與種子',lead:'好吃的水果不只有美味，對植物來說還有大任務。',visual:'fruit',points:[['果實','多由花的部分構造發育而來，通常具有保護種子的作用。'],['種子','在適合的環境下，有機會萌發成新植株。'],['吸引動物','部分果實的顏色、香氣或果肉能吸引動物取食。'],['別亂吃','不是每種植物的果實都可以讓人食用。']],check:['果實通常可以保護哪一個構造？',['根','種子','葉脈','莖節'],1,'果實的重要功能之一是包覆和保護種子。']},
 {id:'3-4',ch:3,title:'原來生活離不開植物',tag:'植物資源',lead:'從早餐到家裡的桌椅，身邊藏著許多植物資源。',visual:'resources',points:[['食物來源','稻米、蔬果、茶葉等來自植物。'],['生活用品','木材可做家具，植物纖維可製作紙張等用品。'],['美化環境','樹木、花卉可用於庭園、校園的綠化。'],['善用資源','植物資源很寶貴，應盡量減少不必要的浪費。']],check:['木桌的木材主要來自植物哪個部位？',['根','莖（樹幹）','果實','花瓣'],1,'木材主要取自樹木的木質莖。']},
 {id:'3-5',ch:3,title:'從植物到生活用品',tag:'資源應用',lead:'了解物品從哪裡來，就能知道為什麼需要珍惜它們。',visual:'products',points:[['樹木與紙張','製紙原料可能來自木材纖維等植物材料。'],['竹子與器具','竹子可製作多種日常用品。'],['棉花與布料','棉纖維可製作布類用品。'],['先想再用','需要才拿取，延長物品使用時間。']],check:['哪些用品可能使用植物纖維製作？',['紙張','玻璃彈珠','鐵湯匙','陶瓷杯'],0,'紙張常以植物纖維作為原料。']},

/span><div class="lesson-bottom-btns">${idx>0?`<button class="btn soft" data-lesson="${lessons[idx-1].id}">← 上一課</button>`:''}<button class="btn secondary" data-complete="${l.id}">${save.done.includes(l.id)?'✅ 已學會':'🌟 我學會了'}</button>${idx<lessons.length-1?`<button class="btn" data-lesson="${lessons[idx+1].id}">下一課 →</button>`:`<button class="btn" data-go="quiz">去挑戰測驗 →</button>`}</div></div></div></div>`}
function renderQuizSetup(){const topic=quizConfig.ch,n=quizConfig.n,mode=quizConfig.mode;return `<div class="page-head"><div class="crumb">HOME / 挑戰測驗</div><h1>📝 植物知識挑戰賽</h1><p>選單元、選題數，馬上開始闖關。答完每題都有解析！</p></div><div class="quiz-setup"><div class="setup-card"><h3>① 我要挑戰哪一區？</h3><div class="quiz-topic-grid"><button class="select-card ${topic===0?'active':''}" data-set-ch="0"><span class="icon">🎲</span>全部隨機</button>${chapters.map(ch=>`<button class="select-card ${topic===ch.id?'active':''}" data-set-ch="${ch.id}"><span class="icon">${ch.icon}</span>${ch.short}</button>`).join('')}<button class="select-card ${topic===-1?'active':''}" data-set-ch="-1"><span class="icon">💡</span>我的錯題 (${save.wrong.length})</button></div></div><div class="setup-card"><h3>② 選擇挑戰模式</h3><div class="option-row"><button class="chip ${mode==='normal'?'active':''}" data-set-mode="normal">🌿 輕鬆模式</button><button class="chip ${mode==='timed'?'active':''}" data-set-mode="timed">⚡ 120 秒限時</button></div><h3>③ 我要挑戰幾題？</h3><div class="option-row">${[5,10,15,20].map(k=>`<button class="chip ${n===k?'active':''}" data-set-n="${k}">${k} 題</button>`).join('')}</div><div class="setup-hint">✅ 選擇後立即答題，顯示正確答案與觀念解析。<br>⭐ 答對可得經驗值，連續答對還有加分！<br>💾 錯題自動記錄在本機，下次可專門複習。</div><button class="btn" data-action="start-quiz" style="width:100%">🚀 出發！開始挑戰</button></div></div><div class="notice">📘 出題依據：上傳的「國小小無敵學習卷－自然科學（三上）」第1～4回，依其知識主題重新編寫。網站題目與原卷題號不一一對應。</div>`}
function startQuiz(){let pool=QB.filter(q=>quizConfig.ch===0||q.ch===quizConfig.ch||(quizConfig.ch===-1&&save.wrong.includes(q.id)));if(!pool.length){toast('目前沒有這個單元的錯題，可以先做一般測驗！');return}const questions=shuffle(pool).slice(0,quizConfig.n).map(q=>{let order=shuffle([0,1,2,3]);return {...q,options:order.map(i=>q.options[i]),correct:order.indexOf(q.correct)}});quiz={questions,index:0,correct:0,streak:0,best:0,selected:null,hint:false,started:Date.now(),deadline:quizConfig.mode==='timed'?Date.now()+120000:null,mode:quizConfig.mode,bonus:0,answered:0};view='quizzing';render();window.scrollTo(0,0)}
function remaining(){return quiz&&quiz.deadline?Math.max(0,Math.ceil((quiz.deadline-Date.now())/1000)):null}
function renderQuiz(){if(!quiz)return renderQuizSetup();const q=quiz.questions[quiz.index],answered=quiz.selected!==null,rem=remaining();if(!q)return '';return `<div class="page-head" style="text-align:center"><div class="crumb">🌟 植物探險挑戰賽</div><h1>小小植物學家闖關中</h1></div><div class="quiz-card"><div class="quiz-meta"><span>📚 ${chapters[q.ch-1].short} ・ 第 ${quiz.index+1} / ${quiz.questions.length} 題</span><span id="countdown">${quiz.deadline?'⏱️ '+Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0'):'🌿 不限時間'}</span></div><div class="quiz-bar"><span style="width:${((quiz.index+1)/quiz.questions.length)*100}%"></span></div><div class="quiz-illustration" aria-hidden="true">${q.emoji}</div><h2 class="question-title">${esc(q.question)}</h2><div class="answer-grid">${q.options.map((opt,i)=>`<button class="answer ${answered?(i===q.correct?'correct':i===quiz.selected?'wrong':''):''}" data-answer="${i}" ${answered?'disabled':''}><span class="choice-letter">${String.fromCharCode(65+i)}</span><span>${esc(opt)}</span></button>`).join('')}</div>${answered?`<div class="feedback-box ${quiz.selected===q.correct?'':'incorrect'}"><strong>${quiz.selected===q.correct?'🎉 太棒了，答對啦！':'🌱 沒關係，這題學會就賺到了！'}</strong><p>${esc(q.explanation)}</p><div class="feedback-foot"><span class="source-chip">📖 對應${chapters[q.ch-1].source}</span><button class="btn small" data-action="next-question">${quiz.index===quiz.questions.length-1?'查看挑戰結果 →':'下一題 →'}</button></div></div>`:quiz.hint?`<div class="feedback-box" style="background:#fff8eb;border-color:#f0e5ca">💡 小提示：${esc(q.hint)}</div>`:''}<div class="quiz-foot"><button class="hint-btn" data-action="hint" ${answered?'disabled':''}>💡 ${quiz.hint?'提示已顯示':'給我小提示'}</button><div class="quiz-score"><span>✅ ${quiz.correct} 答對</span><span>🔥 ${quiz.streak} 連對</span></div></div></div>`}
function answer(i){if(!quiz||quiz.selected!==null)return;const q=quiz.questions[quiz.index];if(i<0||i>=q.options.length)return;quiz.selected=i;quiz.answered++;save.answered++;const good=i===q.correct;if(good){quiz.correct++;save.right++;quiz.streak++;quiz.best=Math.max(quiz.best,quiz.streak);save.bestStreak=Math.max(save.bestStreak,quiz.streak);const xp=10+(quiz.streak>=3?5:0);addXP(xp);quiz.bonus+=xp;save.wrong=save.wrong.filter(id=>id!==q.id);sound(true);if(quiz.streak%5===0)confetti()}else{quiz.streak=0;if(!save.wrong.includes(q.id))save.wrong.push(q.id);sound(false)}persist();render();}
function nextQuestion(){if(!quiz||quiz.selected===null)return;if(quiz.index+1>=quiz.questions.length){finishQuiz();return}quiz.index++;quiz.selected=null;quiz.hint=false;render()}
function finishQuiz(){if(!quiz)return;save.sessions++;persist();view='result';render();if(quiz.correct>=Math.ceil(quiz.questions.length*.8))confetti()}
function renderResult(){if(!quiz)return renderQuizSetup();const rate=Math.round(quiz.correct/quiz.questions.length*100);return `<div class="page-head" style="text-align:center"><div class="crumb">挑戰完成 / 結果出爐</div></div><div class="result"><div class="result-icon">${rate>=90?'🏆':rate>=70?'🥳':'🌻'}</div><h2>${rate>=90?'哇！你是植物知識王！':rate>=70?'太厲害了，繼續加油！':'每次挑戰都在變更厲害！'}</h2><div class="result-number">${rate}<span style="font-size:25px">%</span></div><p>這次答對了 ${quiz.correct} 題，共 ${quiz.questions.length} 題。</p><div class="result-metrics"><div><strong>${quiz.correct}/${quiz.questions.length}</strong><small>答對題數</small></div><div><strong>${quiz.best}</strong><small>最高連對</small></div><div><strong>+${quiz.bonus}</strong><small>得到 XP</small></div></div><div class="result-actions"><button class="btn" data-action="retry-quiz">🔄 再挑戰一次</button><button class="btn secondary" data-go="wrong">📒 複習錯題</button><button class="btn soft" data-go="home">🏡 回首頁</button></div></div>`}

function renderGame(){if(!game)return renderGames();if(game.type==='anatomy'){const done=game.index>=game.targets.length;return `<div class="page-head"><button class="back" data-go="games">← 返回遊戲場</button><h1>🌼 植物部位點點樂</h1><p>認識植物的五個重要部位。</p></div><div class="game-screen"><div class="game-title-row"><div><h2>${done?'🎉 任務完成！':'找出正確部位'}</h2><p>點選圖上的問號，或用右邊的按鈕作答。</p></div><div class="game-progress">${game.score} / 5 🌟</div></div>${done?`<div class="result-icon" style="text-align:center">🏆</div><h2 style="text-align:center">你把植物身體都認識了！</h2><div class="result-actions"><button class="btn" data-start-game="anatomy">再玩一次</button><button class="btn secondary" data-go="games">其他遊戲</button></div>`:`<div class="anatomy-wrap"><div class="anatomy-board">${anatomySVG(true)}</div><div class="anatomy-info"><div class="target-prompt">現在請找出：<strong>${parts[game.targets[game.index]]}</strong></div><div class="part-choices">${Object.entries(parts).map(([k,v])=>`<button data-part="${k}">${v}</button>`).join('')}</div><div class="game-message" aria-live="polite">${esc(game.msg)}</div></div></div>`}</div>`}
if(game.type==='memory'){const done=game.matched.length===pairs.length;return `<div class="page-head"><button class="back" data-go="games">← 返回遊戲場</button><h1>🃏 植物資源翻翻牌</h1><p>找到六組「植物原料與日常用途」的好朋友。</p></div><div class="game-screen"><div class="game-title-row"><div><h2>${done?'🎉 全部配對成功！':'翻開卡片，尋找配對'}</h2><p>翻兩張牌，如果是同組，就能保留牌面。</p></div><div class="game-progress">完成 ${game.matched.length}/6 組・翻牌 ${game.tries} 次</div></div><div class="memory-grid">${game.cards.map((c,i)=>{const matched=game.matched.includes(c.id),up=matched||game.flipped.includes(i);return `<button class="memory-card ${up?'revealed':''} ${matched?'matched':''}" data-flip="${i}" ${matched||game.locked?'disabled':''} aria-label="${up?esc(c.label):'尚未翻開的卡片 '+(i+1)}">${up?esc(c.label):''}</button>`}).join('')}</div><div class="game-message" id="memory-msg">${esc(game.msg)}</div>${done?`<div class="result-actions" style="margin-top:20px"><button class="btn" data-start-game="memory">再玩一次</button><button class="btn secondary" data-go="games">其他遊戲</button></div>`:''}</div>`}
const done=game.index>=game.items.length, item=game.items[game.index];return `<div class="page-head"><button class="back" data-go="games">← 返回遊戲場</button><h1>🧺 資源分類快手王</h1><p>一個個找出植物資源的生活用途。</p></div><div class="game-screen"><div class="game-title-row"><h2>${done?'🎉 資源分類完成！':'將物品放到正確的分類'}</h2><div class="game-progress">得分 ${game.score}・${Math.min(game.index+1,game.items.length)}/${game.items.length}</div></div>${done?`<div class="result-icon" style="text-align:center">🌟</div><h2 style="text-align:center">你答對 ${game.score}/${game.items.length} 次！</h2><p style="text-align:center;color:#718479">植物可以提供食物、生活用品，也能美化環境。</p><div class="result-actions"><button class="btn" data-start-game="sort">再玩一次</button><button class="btn secondary" data-go="games">其他遊戲</button></div>`:`<div class="sort-layout"><div class="sort-card"><div><span class="emoji">${item[0]}</span><strong>${item[1]}</strong><span class="tiny">請選擇最主要的分類</span></div></div><div class="sort-categories">${[['🍚','食物／飲品'],['🪑','生活用品'],['🌷','美化環境']].map(([e,s],i)=>`<button class="sort-cat" data-sort="${i}"><span>${e}</span>${s}　→</button>`).join('')}</div></div><div class="game-message" id="sort-msg" style="margin-top:15px">${esc(game.msg)}</div>`}</div>`}
function choosePart(part){if(!game||game.type!=='anatomy'||game.index>=game.targets.length)return;if(part===game.targets[game.index]){game.score++;game.index++;game.msg='✅ 找到了！你真的很會觀察！';sound(true);if(game.index===game.targets.length)completeGame();render()}else{game.msg='🔍 還差一點！再看看圖上的位置。';sound(false);render()}}
function flip(index){if(!game||game.type!=='memory'||game.locked||game.flipped.includes(index)||game.matched.includes(game.cards[index]?.id))return;game.flipped.push(index);if(game.flipped.length===2){game.tries++;const [a,b]=game.flipped;if(game.cards[a].id===game.cards[b].id){game.matched.push(game.cards[a].id);game.flipped=[];game.msg='🎉 太棒了！這兩張是好朋友。';sound(true);if(game.matched.length===pairs.length)completeGame();render()}else{game.msg='再試試看！這兩張不是同一組。';game.locked=true;render();setTimeout(()=>{if(!game||game.type!=='memory')return;game.flipped=[];game.locked=false;render()},900)}}else{render()}}
function sortChoose(i){if(!game||game.type!=='sort'||game.index>=game.items.length)return;const correct=game.items[game.index][2]===i;if(correct){game.score++;sound(true);toast('🌟 分類正確！')}else{sound(false);toast('🌱 這個物品的主要用途是：'+['食物／飲品','生活用品','美化環境'][game.items[game.index][2]])}game.index++;if(game.index===game.items.length)completeGame();render()}
const awards=[['🌱','種子新手','完成第一堂課',()=>save.done.length>=1],['📚','觀念達人','完成 10 堂課',()=>save.done.length>=10],['🌳','植物博士','完成所有 20 堂課',()=>save.done.length>=20],['⭐','星星收藏家','累積 200 XP',()=>save.xp>=200],['🔥','連對高手','曾連對 5 題',()=>save.bestStreak>=5],['🎮','遊戲通關王','完成 3 種遊戲',()=>save.gameWins.length>=3]];
function renderProfile(){return `<div class="page-head"><div class="crumb">HOME / 我的成就</div><h1>🏆 小小探險家成就館</h1><p>看見自己今天又進步了多少！所有紀錄只儲存在這台裝置。</p></div><div class="dashboard"><section class="dash-card"><h2>📊 我的學習紀錄</h2><div class="dash-number">${save.xp} <span style="font-size:18px;color:#8a9b84">XP</span></div><div class="tiny">累積經驗值</div><div class="result-metrics"><div><strong>${save.done.length}/20</strong><small>已學觀念</small></div><div><strong>${save.sessions}</strong><small>測驗次數</small></div><div><strong>${save.answered?Math.round(save.right/save.answered*100):0}%</strong><small>累積答對率</small></div></div>${chapters.map(ch=>`<div class="track-row"><div style="display:flex;justify-content:space-between"><strong>${ch.icon} ${ch.short}</strong><span>${completedIn(ch.id)}/5</span></div><div class="bar"><span style="width:${completedIn(ch.id)*20}%"></span></div></div>`).join('')}</section><section class="dash-card"><h2>🏅 我收集的勳章</h2><div class="badge-grid">${awards.map(([emoji,name,how,test])=>`<div class="award ${test()?'unlocked':''}"><div class="award-emoji">${emoji}</div><strong>${name}</strong><small>${test()?'✅ 已解鎖':how}</small></div>`).join('')}</div><div class="notice" style="margin-top:19px">💡 解鎖方法：認真學習、玩完三種小遊戲、在測驗中連續答對，就有機會得到更多勳章。</div></section></div><div class="end-banner"><div><h3>🧭 你想繼續哪一段旅程？</h3><p>還有 ${20-save.done.length} 堂觀念課等你探索，以及 ${save.wrong.length} 題錯題等待複習。</p></div><button class="btn" data-lesson="${lessons.find(l=>!save.done.includes(l.id))?.id||'1-1'}">繼續學習 ➜</button></div><div style="text-align:right;margin:25px 0"><button class="back" data-action="reset">🗑️ 清除這台裝置的學習紀錄</button></div>`}
function renderWrong(){const wrong=QB.filter(q=>save.wrong.includes(q.id));return `<div class="page-head"><div class="crumb">HOME / 錯題本</div><h1>💡 我的錯題複習本</h1><p>答錯不代表失敗，每訂正一題都會更厲害。</p></div>${!wrong.length?`<div class="empty"><div class="large">🌈</div><h2>目前沒有需要複習的題目！</h2><p>去挑戰測驗吧！答錯的題目會自動收藏到這裡。</p><button class="btn" data-go="quiz">開始挑戰 ➜</button></div>`:`<div class="notice">📒 共 ${wrong.length} 題。完成錯題複習測驗，答對的題目就會從清單中移除。</div><div class="wrong-list">${wrong.map((q,i)=>`<div class="wrong-item"><div><small>${chapters[q.ch-1].icon} ${chapters[q.ch-1].short} ・ 第 ${i+1} 題</small><strong>${esc(q.question)}</strong></div><button class="btn soft" data-review-q="${q.id}" style="white-space:nowrap">練習</button></div>`).join('')}</div><div class="end-banner"><div><h3>一起把這些題目打敗！</h3><p>答對就能從錯題本畢業。</p></div><button class="btn" data-action="wrong-quiz">💪 全部複習</button></div>`}`}
function render(){renderNav();app.innerHTML=view==='home'?renderHome():view==='lessons'?renderLessons():view==='quiz'?renderQuizSetup():view==='quizzing'?renderQuiz():view==='result'?renderResult():view==='games'?renderGames():view==='game'?renderGame():view==='wrong'?renderWrong():renderProfile()}
function reset(){if(!confirm('確定清除這台裝置上的所有學習進度、星星與錯題紀錄嗎？此操作無法復原。'))return;save={...initial};persist();go('home');toast('已清除本機學習進度')}
// 集中式事件委派，切換介面後不需重新綁定按鈕
(document).addEventListener('click',(event)=>{const hit=event.target.closest('[data-go],[data-lesson],[data-answer],[data-mini],[data-complete],[data-set-ch],[data-set-n],[data-set-mode],[data-action],[data-start-game],[data-part],[data-flip],[data-sort],[data-review-q]');if(!hit||hit.disabled)return;
if(hit.dataset.go){go(hit.dataset.go);return}
if(hit.dataset.lesson){goLesson(hit.dataset.lesson);return}
if(hit.dataset.complete){const id=hit.dataset.complete;if(!save.done.includes(id)){save.done.push(id);addXP(15);sound();toast('🌟 觀念學會了！+15 XP')}else toast('這堂課已經學會囉！');persist();render();return}
if(hit.dataset.mini!==undefined){const l=lessons.find(x=>x.id===lessonId);if(miniAnswered[l.id])return;const chosen=Number(hit.dataset.mini);const good=chosen===l.check[2];miniAnswered[l.id]={chosen,good};sound(good);if(good){addXP(5);toast('⭐ 小測驗答對！+5 XP')}render();return}
if(hit.dataset.setCh!==undefined){quizConfig.ch=Number(hit.dataset.setCh);render();return}
if(hit.dataset.setN){quizConfig.n=Number(hit.dataset.setN);render();return}
if(hit.dataset.setMode){quizConfig.mode=hit.dataset.setMode;render();return}
if(hit.dataset.answer!==undefined){answer(Number(hit.dataset.answer));return}
if(hit.dataset.startGame){startGame(hit.dataset.startGame);return}
if(hit.dataset.part){choosePart(hit.dataset.part);return}
if(hit.dataset.flip!==undefined){flip(Number(hit.dataset.flip));return}
if(hit.dataset.sort!==undefined){sortChoose(Number(hit.dataset.sort));return}
if(hit.dataset.reviewQ){const q=QB.find(q=>q.id===hit.dataset.reviewQ);quizConfig.ch=-1;quizConfig.n=5;quiz={questions:[{...q}],index:0,correct:0,streak:0,best:0,selected:null,hint:false,started:Date.now(),deadline:null,mode:'normal',bonus:0,answered:0};go('quizzing');return}
if(hit.dataset.action){const a=hit.dataset.action;if(a==='start-quiz')startQuiz();else if(a==='next-question')nextQuestion();else if(a==='hint'){quiz.hint=true;render()}else if(a==='retry-quiz')startQuiz();else if(a==='wrong-quiz'){quizConfig.ch=-1;quizConfig.n=20;quizConfig.mode='normal';startQuiz()}else if(a==='reset')reset()}});
byId('sound-btn').addEventListener('click',()=>{save.sound=!save.sound;persist();renderNav();toast(save.sound?'已開啟音效 🔊':'已關閉音效 🔇')});
document.addEventListener('keydown',(e)=>{const h=e.target.closest('[data-part][role="button"]');if(h&&(e.key==='Enter'||e.key===' ')){e.preventDefault();choosePart(h.dataset.part)}});
setInterval(()=>{if(view==='quizzing'&&quiz&&quiz.deadline){const rem=remaining();const box=byId('countdown');if(box)box.textContent='⏱️ '+Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0');if(rem<=0){finishQuiz();toast('⏰ 時間到！未作答題目計為未答對，來看看成果吧！')}}},500);
render();
</script>
</body>
</html>
